
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVISHA Connect</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #edf2f8;
  font-family: Arial, sans-serif;
  color: #172b45;
}
.header {
  background: #087bd5;
  color: white;
  padding: 20px;
  text-align: center;
}
.header h2 {
  margin: 0;
}
.container {
  max-width: 480px;
  margin: 25px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 3px 15px #0001;
}
input, textarea {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ccd6e2;
  border-radius: 9px;
  font-size: 16px;
}
button {
  background: #087bd5;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}
.full {
  width: 100%;
}
#chat {
  display: none;
}
.messages {
  height: 330px;
  overflow-y: auto;
  padding: 12px;
  background: #edf3f9;
  border-radius: 12px;
  margin: 15px 0;
}
.message {
  background: white;
  padding: 12px;
  border-radius: 12px;
  margin: 9px 0;
  max-width: 85%;
  overflow-wrap: anywhere;
}
.mine {
  background: #cce8ff;
  margin-left: auto;
}
.send {
  display: flex;
  gap: 7px;
}
.send input {
  min-width: 0;
}
.note {
  font-size: 12px;
  color: #718096;
  text-align: center;
}
#preview {
  max-width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header class="header">
  <h2>AVISHA Connect</h2>
  <p>Private Digital Messaging</p>
</header>

<main class="container">

<div class="card" id="login">
  <h2>Welcome</h2>
  <p>Enter your access password to continue.</p>

  <input type="password"
    id="password"
    placeholder="Enter your password">

  <button class="full" onclick="openDemo()">
    Open Chat Demo
  </button>
</div>

<div class="card" id="chat">
  <h3>My Conversation</h3>
  <div class="messages" id="messages">
    <div class="message">
      Welcome to AVISHA Connect!
    </div>
  </div>

  <div class="send">
    <input id="message"
      placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>

  <input type="file" id="photo" accept="image/*"
    onchange="showPhoto(event)">

  <img id="preview" style="display:none">

  <p class="note">
    Demo only — messages are not delivered to another person.
  </p>
</div>

</main>

<script>
function openDemo() {
  const password = document.getElementById("password").value;

  if (!password.trim()) {
    alert("Please enter a demo password.");
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
}

function sendMessage() {
  const input = document.getElementById("message");
  const value = input.value.trim();

  if (!value) return;

  const msg = document.createElement("div");
  msg.className = "message mine";
  msg.textContent = value;

  document.getElementById("messages").appendChild(msg);
  input.value = "";
  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;
}

function showPhoto(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select an image.");
    return;
  }

  const preview = document.getElementById("preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}
</script>

</body>
</html>
